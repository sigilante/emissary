<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;aspect-ratio:1;border:1px solid rgba(247,241,210,.6);display:grid;place-items:center;background:rgba(247,241,210,.02);">
  <sc-if value="{{ isGalaxy }}" hint-placeholder-val="{{ true }}"><div style="width:44%;height:44%;background:#fed107;transform:rotate(45deg);"></div></sc-if>
  <sc-if value="{{ isStar }}"><div style="width:48%;height:48%;border:1.5px solid #f7f1d2;transform:rotate(45deg);"></div></sc-if>
  <sc-if value="{{ isPlanet }}"><div style="width:40%;height:40%;border:1.5px solid #f7f1d2;"></div></sc-if>
  <div style="position:absolute;top:-1px;left:-1px;width:4px;height:4px;border-top:1px solid #fed107;border-left:1px solid #fed107;"></div>
  <div style="position:absolute;bottom:-1px;right:-1px;width:4px;height:4px;border-bottom:1px solid #fed107;border-right:1px solid #fed107;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:40,&quot;height&quot;:40},&quot;ship&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;~sampel-palnet&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const s=(this.props.ship||'~zod').replace('~','');
    const words=s.split('-');
    let cls='planet';
    if(words.length===1) cls = s.length<=3 ? 'galaxy' : 'star';
    return { isGalaxy:cls==='galaxy', isStar:cls==='star', isPlanet:cls==='planet' };
  }
}
</script>
</body>
</html>
