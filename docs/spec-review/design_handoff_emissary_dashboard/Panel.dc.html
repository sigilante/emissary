<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;border:1px solid rgba(247,241,210,.34);padding:20px 22px 22px;background:rgba(247,241,210,.014);">
  <div style="position:absolute;top:-1px;left:-1px;width:13px;height:13px;border-top:2px solid #fed107;border-left:2px solid #fed107;"></div>
  <div style="position:absolute;top:-1px;right:-1px;width:13px;height:13px;border-top:2px solid #fed107;border-right:2px solid #fed107;"></div>
  <div style="position:absolute;bottom:-1px;left:-1px;width:13px;height:13px;border-bottom:2px solid #fed107;border-left:2px solid #fed107;"></div>
  <div style="position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;border-bottom:2px solid #fed107;border-right:2px solid #fed107;"></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid rgba(247,241,210,.22);padding-bottom:11px;margin-bottom:16px;">
    <span style="font-family:'Jost',sans-serif;text-transform:uppercase;letter-spacing:.24em;font-size:12.5px;font-weight:500;color:#f7f1d2;">{{ title }}</span>
    <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;color:#fed107;white-space:nowrap;">{{ tag }}</span>
  </div>
  {{ children }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:220},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SECTION&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;}}"></script>
</body>
</html>
